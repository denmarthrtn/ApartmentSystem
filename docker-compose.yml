# Starts SQL Server and the API with one command:
#   cp .env.example .env    (then fill in the values)
#   docker compose up --build
# Swagger: http://localhost:8080/swagger   Health: http://localhost:8080/health

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: ApartmentManagementSystem/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=db;Database=ApartmentDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:-}
      Database__MigrateOnStartup: "true"   # create the schema and sample data in the empty container database
      DemoMode__Enabled: "true"            # demo logins with public passwords; never turn this on in Azure
      Swagger__Enabled: "true"

volumes:
  sqldata:
